services:
  - type: web
    name: educore-backend
    plan: free
    env: node
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    rootDir: Backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: educore-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
        # The user will need to update this with their Vercel URL
      - key: EMAIL_HOST
        value: smtp.mailtrap.io
      - key: EMAIL_PORT
        value: 2525
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        value: "noreply@educore.com"

databases:
  - name: educore-db
    plan: free
    databaseName: educore
    user: educore_user
